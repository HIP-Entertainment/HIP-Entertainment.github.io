<title>HistoryIsPower Entertainment has moved to historyispower.com</title>

<!-- Forwarding page for the old address https://hip-entertainment.github.io/ (repo HIP-Entertainment.github.io).

     The same file is published as index.html and 404.html, so every old link forwards. Published with
     Website\tools\publish-site.ps1 -Redirect. Project sites such as /Trillionaire-Tycoon-Privacy-Policy/ are separate repos
     and keep working. -->
<script>location.replace('https://historyispower.com' + location.pathname + location.search + location.hash);</script>
